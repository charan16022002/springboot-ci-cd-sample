- name: Build & test (Maven)
  if: matrix.language == 'java'
  run: |
    if [ -f pom.xml ]; then
      mvn -B -DskipTests=false clean test
    else
      echo "No pom.xml found — skipping Java build"
    fi

- name: Build Docker Image
  if: matrix.language == 'java'
  run: |
    docker build -t springboot-app:latest .
